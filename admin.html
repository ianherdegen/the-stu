<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>THE STU — Artist access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=30">
  <style>
    body { background: #fff; }
    .gate-screen {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .gate-screen[hidden] { display: none; }
    .gate {
      width: min(22rem, 100%);
      display: grid;
      justify-items: center;
      gap: 0.75rem;
      margin: 0;
      padding: 2.1rem 1.5rem 1.5rem;
      text-align: center;
      background: #fff;
      border: 3px solid #1c1a17;
      border-radius: 22px;
      box-shadow: 6px 6px 0 #1c1a17;
    }
    .gate h1 {
      margin: 0;
      font-family: "Anybody", sans-serif;
      font-weight: 800;
      font-stretch: 120%;
      font-size: clamp(2.6rem, 8vw, 3.4rem);
      letter-spacing: 0.02em;
      line-height: 0.9;
    }
    .gate-kicker {
      margin: 0 0 0.35rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.82rem;
    }
    .gate .note { width: 100%; }
    .gate-back {
      color: #6f675f;
      font-weight: 600;
      text-decoration: none;
    }
    .gate-back:hover { color: #1c1a17; }
    .admin {
      width: min(880px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }
    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .admin h1 {
      margin: 0;
      font-family: "Anybody", sans-serif;
      font-weight: 800;
      font-stretch: 120%;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      letter-spacing: 0.02em;
    }
    .admin h2 {
      margin: 2rem 0 0.8rem;
      font-size: 1.35rem;
    }
    .admin form, .row, .piece-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }
    .admin input, .admin select, .admin textarea, .gate input {
      font: inherit;
      color: #1c1a17;
      background: #fff;
      border: 3px solid #1c1a17;
      border-radius: 12px;
      padding: 0.4rem 0.7rem;
    }
    .gate input {
      width: 100%;
      text-align: center;
      font-size: 1.05rem;
      padding: 0.65rem 0.8rem;
    }
    .admin textarea { width: 100%; min-height: 5rem; resize: vertical; }
    .stack { display: grid; gap: 0.55rem; margin-bottom: 1rem; }
    .admin button, .gate button, .cropper button, .text-button {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: #1c1a17;
      background: #ffd23f;
      border: 3px solid #1c1a17;
      border-radius: 999px;
      padding: 0.28rem 0.85rem;
      box-shadow: 3px 3px 0 #1c1a17;
      cursor: pointer;
    }
    .quiet { background: #fff; }
    .note { color: #a33b32; font-weight: 600; min-height: 1.2em; }
    .list { display: grid; gap: 0.7rem; }
    .row, .piece-row {
      justify-content: space-between;
      border-bottom: 2px solid #efe8dc;
      padding-bottom: 0.7rem;
    }
    .piece-row { align-items: flex-start; }
    .thumb {
      width: 64px;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      border: 3px solid #1c1a17;
      background: #f7f1e6;
    }
    .thumb[data-ratio="4:5"] { aspect-ratio: 4 / 5; }
    .piece-copy { flex: 1; min-width: 12rem; }
    .piece-copy p { margin: 0.15rem 0 0; color: #6f675f; }
    .actions { display: flex; gap: 0.4rem; }
    .hint { margin: 0; color: #6f675f; font-size: 0.92rem; }
    #piece-image,
    #piece-form .hint,
    #crop-preview,
    .collection-field { flex-basis: 100%; }
    .collection-field { display: flex; flex-wrap: wrap; gap: 0.55rem; }
    .collection-field[hidden] { display: none; }
    .collection-field select,
    .collection-field input { flex: 1 1 12rem; }
    .collection-field [hidden] { display: none; }
    .crop-preview { display: flex; align-items: center; gap: 0.75rem; }
    .crop-preview[hidden] { display: none; }
    .crop-preview img {
      width: 72px;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      border: 3px solid #1c1a17;
      background: #f7f1e6;
    }
    .crop-preview img[data-ratio="4:5"] { aspect-ratio: 4 / 5; }
    .ratio-choices { display: flex; gap: 0.45rem; }
    .ratio-choices button[aria-pressed="true"] { background: #ffd23f; }
    .cropper {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(28, 26, 23, 0.62);
    }
    .cropper[hidden] { display: none; }
    .cropper-card {
      width: min(26rem, 100%);
      display: grid;
      justify-items: center;
      gap: 0.75rem;
      padding: 1.25rem 1.2rem 1.1rem;
      text-align: center;
      background: #fff;
      border: 3px solid #1c1a17;
      border-radius: 22px;
      box-shadow: 6px 6px 0 #1c1a17;
    }
    .cropper-card h2 { margin: 0; font-size: 1.45rem; }
    .cropper-card p { margin: 0; color: #6f675f; }
    .crop-stage {
      height: min(360px, 52vh);
      aspect-ratio: 3 / 4;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background: #fff;
      box-shadow: 0 0 0 8px #111;
    }
    .crop-stage[data-ratio="4:5"] { aspect-ratio: 4 / 5; }
    .crop-stage.is-dragging { cursor: grabbing; }
    .crop-stage img {
      position: absolute;
      left: 0;
      top: 0;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .crop-zoom-label {
      width: min(240px, 80vw);
      display: grid;
      gap: 0.3rem;
      text-align: left;
      font-weight: 600;
      color: #1c1a17;
    }
    .crop-zoom { width: 100%; accent-color: #1c1a17; }
  </style>
</head>
<body>
  <div class="gate-screen" id="gate-screen">
    <form id="gate" class="gate">
      <h1>THE STU</h1>
      <p class="gate-kicker">Artist access</p>
      <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
      <button type="submit">Enter</button>
      <p class="note" id="gate-notice"></p>
      <a class="gate-back" href="/">Back to the site</a>
    </form>
  </div>
  <main class="admin" id="desk" hidden>
    <div class="admin-top">
      <h1>THE STU</h1>
      <button type="button" id="logout" class="quiet">Log out</button>
    </div>
    <p class="note" id="notice"></p>

      <h2>Artists</h2>
      <form id="artist-form" class="stack">
        <div class="row">
          <input id="artist-name" placeholder="Name" maxlength="80" required>
          <button type="submit">Add artist</button>
        </div>
      </form>
      <div class="list" id="artist-list"></div>

      <h2>Art</h2>
      <form id="piece-form" class="stack">
        <input id="piece-id" type="hidden">
        <input id="piece-title" placeholder="Title" maxlength="120" required>
        <select id="piece-artist">
          <option value="">Unspecified</option>
        </select>
        <div class="collection-field" id="collection-field" hidden>
          <select id="piece-collection" aria-label="Collection">
            <option value="">No collection</option>
          </select>
          <button type="button" id="collection-rename" class="quiet" hidden>Rename</button>
          <input id="piece-collection-new" placeholder="Collection" maxlength="80" hidden>
        </div>
        <textarea id="piece-description" placeholder="Description" maxlength="2000"></textarea>
        <input id="piece-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        <p class="hint">Choosing a picture opens a crop at the closer of 3:4 or 4:5.</p>
        <div class="crop-preview" id="crop-preview" hidden>
          <img id="crop-preview-img" alt="">
          <button type="button" id="crop-again" class="quiet">Adjust crop</button>
        </div>
        <div class="row">
          <button type="submit" id="piece-save">Add art</button>
          <button type="button" id="piece-cancel" class="quiet" hidden>Cancel</button>
        </div>
      </form>
      <div class="list" id="piece-list"></div>
  </main>
  <div class="cropper" id="cropper" hidden>
    <div class="cropper-card" role="dialog" aria-modal="true" aria-labelledby="crop-title">
      <h2 id="crop-title">Crop to 3:4</h2>
      <p>Drag to move. Slide to zoom, then confirm.</p>
      <div class="ratio-choices" role="group" aria-label="Ratio">
        <button type="button" class="quiet" data-ratio-choice="3:4" aria-pressed="true">3:4</button>
        <button type="button" class="quiet" data-ratio-choice="4:5" aria-pressed="false">4:5</button>
      </div>
      <div class="crop-stage" id="crop-stage">
        <img id="crop-image" alt="">
      </div>
      <label class="crop-zoom-label">Zoom
        <input class="crop-zoom" id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1">
      </label>
      <div class="row">
        <button type="button" id="crop-confirm">Use this crop</button>
        <button type="button" id="crop-cancel" class="quiet">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    const notice = document.getElementById("notice");
    const gateNotice = document.getElementById("gate-notice");
    const gate = document.getElementById("gate");
    const gateScreen = document.getElementById("gate-screen");
    const desk = document.getElementById("desk");
    const logout = document.getElementById("logout");
    const artistList = document.getElementById("artist-list");
    const pieceList = document.getElementById("piece-list");
    const artistSelect = document.getElementById("piece-artist");
    const collectionField = document.getElementById("collection-field");
    const collectionSelect = document.getElementById("piece-collection");
    const collectionRename = document.getElementById("collection-rename");
    const collectionNew = document.getElementById("piece-collection-new");
    const NEW_COLLECTION = "__new__";
    const cropper = document.getElementById("cropper");
    const cropStage = document.getElementById("crop-stage");
    const cropImage = document.getElementById("crop-image");
    const cropZoom = document.getElementById("crop-zoom");
    const cropPreview = document.getElementById("crop-preview");
    const cropPreviewImg = document.getElementById("crop-preview-img");
    const RATIOS = { "3:4": 3 / 4, "4:5": 4 / 5 };
    let artists = [];
    let catalog = [];
    let croppedFile = null;
    let croppedRatio = "3:4";
    let previewUrl = "";
    let crop = null;
    let cropSnapshot = null;

    function closestRatio(width, height) {
      const value = width / height;
      return Math.abs(value - RATIOS["3:4"]) <= Math.abs(value - RATIOS["4:5"]) ? "3:4" : "4:5";
    }

    function setRatioChrome(ratio) {
      const next = ratio === "4:5" ? "4:5" : "3:4";
      cropStage.dataset.ratio = next;
      document.getElementById("crop-title").textContent = "Crop to " + next;
      document.querySelectorAll("[data-ratio-choice]").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.ratioChoice === next ? "true" : "false");
      });
      return next;
    }

    function stageSize() {
      const rect = cropStage.getBoundingClientRect();
      return { w: rect.width, h: rect.height };
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("That image couldn't be opened."));
        image.src = url;
      });
    }

    function coverScale(image) {
      const { w, h } = stageSize();
      return Math.max(w / image.naturalWidth, h / image.naturalHeight);
    }

    function clampCrop() {
      const { w, h } = stageSize();
      const width = crop.image.naturalWidth * crop.scale;
      const height = crop.image.naturalHeight * crop.scale;
      crop.x = Math.min(0, Math.max(w - width, crop.x));
      crop.y = Math.min(0, Math.max(h - height, crop.y));
    }

    function paintCrop() {
      const width = crop.image.naturalWidth * crop.scale;
      const height = crop.image.naturalHeight * crop.scale;
      cropImage.style.width = width + "px";
      cropImage.style.height = height + "px";
      cropImage.style.transform = "translate(" + crop.x + "px, " + crop.y + "px)";
    }

    function setZoom(multiplier) {
      const next = Math.min(4, Math.max(1, multiplier));
      const base = coverScale(crop.image);
      const previous = crop.scale;
      const { w, h } = stageSize();
      crop.scale = base * next;
      crop.x = w / 2 - ((w / 2 - crop.x) * crop.scale / previous);
      crop.y = h / 2 - ((h / 2 - crop.y) * crop.scale / previous);
      clampCrop();
      paintCrop();
      cropZoom.value = String(next);
    }

    function centerCrop() {
      const { w, h } = stageSize();
      if (!w || !h) {
        requestAnimationFrame(centerCrop);
        return;
      }
      crop.scale = coverScale(crop.image);
      crop.x = (w - crop.image.naturalWidth * crop.scale) / 2;
      crop.y = (h - crop.image.naturalHeight * crop.scale) / 2;
      clampCrop();
      paintCrop();
      cropZoom.value = "1";
    }

    function openCropper(image, preferred) {
      const same = crop?.image === image;
      cropSnapshot = crop ? { image: crop.image, scale: crop.scale, x: crop.x, y: crop.y, url: crop.url, ratio: crop.ratio } : null;
      const ratio = setRatioChrome(preferred || (same ? crop.ratio : closestRatio(image.naturalWidth, image.naturalHeight)));
      if (!same) crop = { image, url: image.src, scale: 1, x: 0, y: 0, dragging: false, ratio };
      crop.ratio = ratio;
      cropImage.src = image.src;
      cropper.hidden = false;
      document.body.style.overflow = "hidden";
      requestAnimationFrame(() => {
        if (same) {
          clampCrop();
          paintCrop();
          cropZoom.value = String(crop.scale / coverScale(crop.image));
        } else {
          centerCrop();
        }
      });
    }

    function placeOnRatio(focus, multiplier) {
      const { w, h } = stageSize();
      if (!w || !h) {
        requestAnimationFrame(() => placeOnRatio(focus, multiplier));
        return;
      }
      crop.scale = coverScale(crop.image) * multiplier;
      crop.x = w / 2 - focus.x * crop.scale;
      crop.y = h / 2 - focus.y * crop.scale;
      clampCrop();
      paintCrop();
      cropZoom.value = String(multiplier);
    }

    function closeCropper(restore) {
      cropper.hidden = true;
      cropStage.classList.remove("is-dragging");
      document.body.style.overflow = "";
      const abandoned = crop;
      if (restore) crop = cropSnapshot;
      cropSnapshot = null;
      return abandoned;
    }

    function showPreview(url, ratio) {
      if (previewUrl.startsWith("blob:") && previewUrl !== url) URL.revokeObjectURL(previewUrl);
      previewUrl = url;
      cropPreviewImg.src = url;
      cropPreviewImg.dataset.ratio = ratio === "4:5" ? "4:5" : "3:4";
      cropPreview.hidden = false;
    }

    function clearCrop() {
      croppedFile = null;
      crop = null;
      cropSnapshot = null;
      if (previewUrl.startsWith("blob:")) URL.revokeObjectURL(previewUrl);
      previewUrl = "";
      cropPreview.hidden = true;
      cropPreviewImg.removeAttribute("src");
    }

    document.getElementById("piece-image").addEventListener("change", async () => {
      const input = document.getElementById("piece-image");
      const file = input.files[0];
      input.value = "";
      if (!file) return;
      say("");
      if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) {
        say("Use a JPG, PNG, WEBP, or GIF.");
        return;
      }
      const url = URL.createObjectURL(file);
      try {
        openCropper(await loadImage(url));
      } catch (error) {
        URL.revokeObjectURL(url);
        say(error.message);
      }
    });

    cropZoom.addEventListener("input", () => {
      if (!crop) return;
      setZoom(Number(cropZoom.value));
    });

    document.querySelectorAll("[data-ratio-choice]").forEach((button) => {
      button.addEventListener("click", () => {
        if (!crop || crop.ratio === button.dataset.ratioChoice) return;
        const { w, h } = stageSize();
        const focus = {
          x: (w / 2 - crop.x) / crop.scale,
          y: (h / 2 - crop.y) / crop.scale,
        };
        const multiplier = Math.min(4, Math.max(1, Number(cropZoom.value) || 1));
        crop.ratio = setRatioChrome(button.dataset.ratioChoice);
        requestAnimationFrame(() => placeOnRatio(focus, multiplier));
      });
    });

    cropStage.addEventListener("pointerdown", (event) => {
      if (!crop) return;
      crop.dragging = true;
      cropStage.classList.add("is-dragging");
      cropStage.setPointerCapture(event.pointerId);
      crop.pointerX = event.clientX;
      crop.pointerY = event.clientY;
      crop.originX = crop.x;
      crop.originY = crop.y;
    });

    cropStage.addEventListener("pointermove", (event) => {
      if (!crop?.dragging) return;
      crop.x = crop.originX + (event.clientX - crop.pointerX);
      crop.y = crop.originY + (event.clientY - crop.pointerY);
      clampCrop();
      paintCrop();
    });

    function stopDrag() {
      if (!crop) return;
      crop.dragging = false;
      cropStage.classList.remove("is-dragging");
    }
    cropStage.addEventListener("pointerup", stopDrag);
    cropStage.addEventListener("pointercancel", stopDrag);

    cropStage.addEventListener("wheel", (event) => {
      if (!crop || cropper.hidden) return;
      event.preventDefault();
      const current = Number(cropZoom.value) || 1;
      setZoom(current * (event.deltaY < 0 ? 1.06 : 0.94));
    }, { passive: false });

    document.getElementById("crop-cancel").addEventListener("click", () => {
      const abandoned = closeCropper(true);
      if (abandoned?.url?.startsWith("blob:") && abandoned.url !== crop?.url) URL.revokeObjectURL(abandoned.url);
    });

    document.getElementById("crop-confirm").addEventListener("click", async () => {
      const button = document.getElementById("crop-confirm");
      if (!crop || button.disabled) return;
      button.disabled = true;
      const { w, h } = stageSize();
      let sx = -crop.x / crop.scale;
      let sy = -crop.y / crop.scale;
      let sw = w / crop.scale;
      let sh = h / crop.scale;
      const target = RATIOS[crop.ratio] || RATIOS["3:4"];
      const parts = crop.ratio === "4:5" ? [4, 5] : [3, 4];
      const visible = sw / sh;
      if (visible > target) {
        const next = sh * target;
        sx += (sw - next) / 2;
        sw = next;
      } else if (visible < target) {
        const next = sw / target;
        sy += (sh - next) / 2;
        sh = next;
      }
      let outW = Math.round(Math.min(1600, sw));
      outW -= outW % parts[0];
      if (outW < parts[0]) outW = parts[0];
      const outH = Math.round(outW * parts[1] / parts[0]);
      const canvas = document.createElement("canvas");
      canvas.width = outW;
      canvas.height = outH;
      canvas.getContext("2d").drawImage(crop.image, sx, sy, sw, sh, 0, 0, outW, outH);
      let quality = 0.92;
      let blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
      while (blob && blob.size > 3.6 * 1024 * 1024 && quality > 0.5) {
        quality = Math.round((quality - 0.1) * 10) / 10;
        blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
      }
      if (!blob || blob.size > 4 * 1024 * 1024) {
        button.disabled = false;
        say("That crop is still over 4MB. Zoom out a little and try again.");
        return;
      }
      button.disabled = false;
      const previous = cropSnapshot?.url || "";
      croppedRatio = crop.ratio === "4:5" ? "4:5" : "3:4";
      croppedFile = new File([blob], "art.jpg", { type: "image/jpeg" });
      showPreview(URL.createObjectURL(blob), croppedRatio);
      closeCropper(false);
      if (previous.startsWith("blob:") && previous !== crop.url) URL.revokeObjectURL(previous);
      say("");
    });

    document.getElementById("crop-again").addEventListener("click", async () => {
      say("");
      try {
        const preferred = cropPreviewImg.dataset.ratio;
        if (crop?.image) {
          openCropper(crop.image, preferred);
          return;
        }
        if (!previewUrl) return;
        const response = await fetch(previewUrl);
        if (!response.ok) throw new Error("That image couldn't be opened.");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        openCropper(await loadImage(url), preferred);
      } catch (error) {
        say(error.message);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !cropper.hidden) document.getElementById("crop-cancel").click();
    });

    function say(message) {
      const text = message || "";
      notice.textContent = text;
      gateNotice.textContent = text;
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        showGate();
        throw new Error(data.error || "Sign in required.");
      }
      if (!response.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    function showGate() {
      gateScreen.hidden = false;
      desk.hidden = true;
    }

    function showDesk() {
      gateScreen.hidden = true;
      desk.hidden = false;
    }

    function collectionsFor(artistId) {
      const names = new Set();
      catalog.forEach((piece) => {
        if (piece.artistId === artistId && piece.collection) names.add(piece.collection);
      });
      return [...names].sort((a, b) => a.localeCompare(b));
    }

    function collectionValue() {
      if (!artistSelect.value) return "";
      if (!collectionSelect.hidden && collectionSelect.value !== NEW_COLLECTION) return collectionSelect.value;
      return collectionNew.value;
    }

    function syncCollectionRename() {
      const current = !collectionSelect.hidden && collectionSelect.value && collectionSelect.value !== NEW_COLLECTION;
      collectionRename.hidden = !current;
    }

    function fillCollections(selected) {
      const artistId = artistSelect.value;
      const name = selected || "";
      if (!artistId) {
        collectionField.hidden = true;
        collectionSelect.hidden = true;
        collectionNew.hidden = true;
        collectionNew.value = "";
        syncCollectionRename();
        return;
      }
      const names = collectionsFor(artistId);
      collectionField.hidden = false;
      collectionSelect.replaceChildren(new Option("No collection", ""));
      names.forEach((item) => collectionSelect.append(new Option(item, item)));
      if (!names.length) {
        collectionSelect.hidden = true;
        collectionNew.hidden = false;
        collectionNew.placeholder = "Collection";
        collectionNew.value = name;
        syncCollectionRename();
        return;
      }
      collectionSelect.append(new Option("New collection", NEW_COLLECTION));
      collectionSelect.hidden = false;
      if (name && !names.includes(name)) {
        collectionSelect.value = NEW_COLLECTION;
        collectionNew.hidden = false;
        collectionNew.placeholder = "New collection";
        collectionNew.value = name;
        syncCollectionRename();
        return;
      }
      collectionSelect.value = name;
      collectionNew.hidden = true;
      collectionNew.value = "";
      syncCollectionRename();
    }

    artistSelect.addEventListener("change", () => fillCollections(""));

    collectionSelect.addEventListener("change", () => {
      const creating = collectionSelect.value === NEW_COLLECTION;
      collectionNew.hidden = !creating;
      collectionNew.placeholder = "New collection";
      if (!creating) collectionNew.value = "";
      else collectionNew.focus();
      syncCollectionRename();
    });

    collectionRename.addEventListener("click", async () => {
      const from = collectionSelect.value;
      if (!artistSelect.value || !from || from === NEW_COLLECTION) return;
      const next = prompt("Collection name", from);
      if (!next || next.trim() === from) return;
      say("");
      try {
        await api("/api/admin/collections", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ artistId: artistSelect.value, from, to: next }),
        });
        const data = await api("/api/admin/pieces");
        drawPieces(data.pieces);
        fillCollections(next.trim().replace(/\s+/g, " "));
      } catch (error) {
        say(error.message);
      }
    });

    gate.addEventListener("submit", async (event) => {
      event.preventDefault();
      say("");
      try {
        await api("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        document.getElementById("password").value = "";
        showDesk();
        await refresh();
      } catch (error) {
        say(error.message);
      }
    });

    logout.addEventListener("click", async () => {
      await fetch("/api/admin/login", { method: "DELETE" });
      showGate();
    });

    document.getElementById("artist-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("artist-name");
      say("");
      try {
        const data = await api("/api/admin/artists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: input.value }),
        });
        input.value = "";
        artists = data.artists;
        drawArtists();
      } catch (error) {
        say(error.message);
      }
    });

    document.getElementById("piece-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.getElementById("piece-id").value;
      if (!id && !croppedFile) {
        say("Crop the image before adding it.");
        return;
      }
      if (artistSelect.value && !collectionSelect.hidden && collectionSelect.value === NEW_COLLECTION && !collectionNew.value.trim()) {
        say("Name the new collection, or pick one.");
        return;
      }
      say("");
      try {
        const payload = {
          title: document.getElementById("piece-title").value,
          artistId: artistSelect.value,
          collection: collectionValue(),
          description: document.getElementById("piece-description").value,
        };
        if (croppedFile) {
          payload.ratio = croppedRatio;
          payload.image = {
            type: croppedFile.type,
            data: await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result).split(",")[1]);
              reader.onerror = () => reject(new Error("Couldn't read the crop."));
              reader.readAsDataURL(croppedFile);
            }),
          };
        }
        const data = await api(id ? "/api/admin/pieces?id=" + encodeURIComponent(id) : "/api/admin/pieces", {
          method: id ? "PATCH" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        resetPiece();
        drawPieces(data.pieces);
      } catch (error) {
        say(error.message);
      }
    });

    document.getElementById("piece-cancel").addEventListener("click", resetPiece);

    function resetPiece() {
      document.getElementById("piece-form").reset();
      document.getElementById("piece-id").value = "";
      fillCollections("");
      document.getElementById("piece-save").textContent = "Add art";
      document.getElementById("piece-cancel").hidden = true;
      clearCrop();
    }

    function drawArtists() {
      artistList.replaceChildren();
      const selected = artistSelect.value;
      const keptCollection = collectionValue();
      artistSelect.replaceChildren(new Option("Unspecified", ""));
      artists.forEach((artist) => {
        artistSelect.appendChild(new Option(artist.name, artist.id));
        const row = document.createElement("div");
        row.className = "row";
        const name = document.createElement("strong");
        name.textContent = artist.name;
        const actions = document.createElement("div");
        actions.className = "actions";
        const rename = document.createElement("button");
        rename.type = "button";
        rename.className = "quiet";
        rename.textContent = "Rename";
        rename.addEventListener("click", async () => {
          const next = prompt("Name", artist.name);
          if (!next || next.trim() === artist.name) return;
          say("");
          try {
            const data = await api("/api/admin/artists", {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: artist.id, name: next }),
            });
            artists = data.artists;
            drawArtists();
            const pieces = await api("/api/admin/pieces");
            drawPieces(pieces.pieces);
          } catch (error) {
            say(error.message);
          }
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "quiet";
        remove.textContent = "Remove";
        remove.addEventListener("click", async () => {
          if (!confirm("Remove " + artist.name + "? Their art stays, marked unspecified.")) return;
          say("");
          try {
            const data = await api("/api/admin/artists?id=" + encodeURIComponent(artist.id), { method: "DELETE" });
            artists = data.artists;
            drawArtists();
            const pieces = await api("/api/admin/pieces");
            drawPieces(pieces.pieces);
          } catch (error) {
            say(error.message);
          }
        });
        actions.append(rename, remove);
        row.append(name, actions);
        artistList.appendChild(row);
      });
      artistSelect.value = [...artistSelect.options].some((option) => option.value === selected) ? selected : "";
      fillCollections(artistSelect.value === selected ? keptCollection : "");
    }

    function drawPieces(pieces) {
      catalog = pieces;
      pieceList.replaceChildren();
      pieces.forEach((piece) => {
        const row = document.createElement("article");
        row.className = "piece-row";
        if (piece.imageUrl) {
          const image = document.createElement("img");
          image.className = "thumb";
          image.dataset.ratio = piece.ratio === "4:5" ? "4:5" : "3:4";
          image.src = piece.imageUrl;
          image.alt = "";
          row.appendChild(image);
        }
        const copy = document.createElement("div");
        copy.className = "piece-copy";
        const title = document.createElement("strong");
        title.textContent = piece.title;
        const meta = document.createElement("p");
        meta.textContent = (piece.artist || "Unspecified") + (piece.collection ? " · " + piece.collection : "");
        copy.append(title, meta);
        const actions = document.createElement("div");
        actions.className = "actions";
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "quiet";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => {
          document.getElementById("piece-id").value = piece.id;
          document.getElementById("piece-title").value = piece.title;
          artistSelect.value = piece.artistId || "";
          fillCollections(piece.collection || "");
          document.getElementById("piece-description").value = piece.description || "";
          document.getElementById("piece-image").value = "";
          clearCrop();
          if (piece.imageUrl) showPreview(piece.imageUrl, piece.ratio);
          document.getElementById("piece-save").textContent = "Save";
          document.getElementById("piece-cancel").hidden = false;
          document.getElementById("piece-title").focus();
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "quiet";
        remove.textContent = "Remove";
        remove.addEventListener("click", async () => {
          if (!confirm("Remove " + piece.title + "?")) return;
          say("");
          try {
            const data = await api("/api/admin/pieces?id=" + encodeURIComponent(piece.id), { method: "DELETE" });
            if (document.getElementById("piece-id").value === piece.id) resetPiece();
            drawPieces(data.pieces);
          } catch (error) {
            say(error.message);
          }
        });
        actions.append(edit, remove);
        row.append(copy, actions);
        pieceList.appendChild(row);
      });
    }

    async function refresh() {
      const [artistData, pieceData] = await Promise.all([
        api("/api/admin/artists"),
        api("/api/admin/pieces"),
      ]);
      artists = artistData.artists;
      catalog = pieceData.pieces;
      drawArtists();
      drawPieces(pieceData.pieces);
    }

    refresh().then(showDesk).catch(() => showGate());
  </script>
</body>
</html>
